<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Estoque Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Estoque Fácil</h1>
        <p class="subtitulo">Sistema de gerenciamento de produtos gamer</p>

        <div class="formulario">

            <h2>Login</h2>

            <form action="login.php" method="POST">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button type="submit">Entrar</button>

            </form>

            <p style="margin-top: 20px; text-align: center;">
                Não possui cadastro? <a href="cadastro_usuarios.html">Cadastrar usuário</a>
            </p>

        </div>

        <p class="rodape">Estoque Fácil © 2026 | Loja Gamer</p>

    </div>

</body>
</html>
