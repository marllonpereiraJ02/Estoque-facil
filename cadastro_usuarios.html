<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário | Estoque Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Estoque Fácil</h1>
        <p class="subtitulo">Sistema de gerenciamento de produtos gamer</p>

        <div class="formulario">

            <h2>Cadastro de Usuário</h2>

            <form action="cadastro_usuarios.php" method="POST">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" minlength="4" placeholder="Crie uma senha" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p style="margin-top: 20px; text-align: center;">
                Já possui cadastro? <a href="login.html">Fazer login</a>
            </p>

        </div>

        <p class="rodape">Estoque Fácil © 2026 | Loja Gamer</p>

    </div>

</body>
</html>
